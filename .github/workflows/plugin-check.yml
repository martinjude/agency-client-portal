name: Plugin Check

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    name: PHP lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Lint PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: agency-client-portal
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: agency-client-portal
          exclude-directories: 'design,.github,.wordpress-org'
