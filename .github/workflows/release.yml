name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build the zip and publish a GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the plugin version
        run: |
          version="$(sed -n 's/^[ *]*Version:[[:space:]]*//p' agency.php | head -1 | tr -d '[:space:]')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the Version in agency.php ($version)."
            exit 1
          fi

      - name: Build the zip
        run: bash bin/build-zip.sh

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
